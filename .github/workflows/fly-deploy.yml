# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/
#
# The Fly token is fetched from GCP Secret Manager (cognitum-20260110/FLYIO_API_KEY)
# with keyless Workload Identity Federation. There is no GitHub secret. The WIF
# provider only accepts push/workflow_dispatch runs of this workflow on the
# default branch, so this job never runs on pull_request.

name: Fly Deploy
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/186366152200/locations/global/workloadIdentityPools/github-ruvnet-ci/providers/symbolic-scribe
          service_account: ci-symbolic-scribe@cognitum-20260110.iam.gserviceaccount.com
      - id: gsm
        uses: google-github-actions/get-secretmanager-secrets@v2
        with:
          secrets: |-
            fly:cognitum-20260110/FLYIO_API_KEY
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Fly auth smoke test
        run: flyctl auth whoami
        env:
          FLY_API_TOKEN: ${{ steps.gsm.outputs.fly }}
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ steps.gsm.outputs.fly }}
